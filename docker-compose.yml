services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USE_MOCK_DATA: ${NEXT_PUBLIC_USE_MOCK_DATA:-true}
    container_name: soulexp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      USE_MOCK_DATA: ${USE_MOCK_DATA:-true}
      NEXT_PUBLIC_USE_MOCK_DATA: ${NEXT_PUBLIC_USE_MOCK_DATA:-true}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

  postgres:
    image: postgres:17-alpine
    container_name: soulexp-postgres
    profiles: ["backend"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: soulexp
      POSTGRES_PASSWORD: soulexp_dev_pwd
      POSTGRES_DB: soulexp
    ports:
      - "5433:5432"
    volumes:
      - soulexp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulexp -d soulexp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  soulexp_pg_data: